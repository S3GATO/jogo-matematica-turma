<body>

    <div class="container">
        <p>Partida criada automaticamente</p>

        <div class="senha-box">
            <span class="senha-titulo">Senha da partida:</span>
            <div id="senhaPartida" class="senha-codigo">Gerando...</div>
            <small>Compartilhe essa senha com os alunos para que entrem na mesma partida</small>
        </div>

        <h3 style="text-align: left; margin-top: 20px;">Alunos conectados</h3>
        <div class="alunos-box" id="listaAlunos">
            <span style="color: #888;">Aguardando alunos...</span>
        </div>

        <div style="margin-top: 30px;">
            <button class="btn-verde" id="btnIniciarJogo" onclick="avancarParaPainelPerguntas()">Iniciar Jogo</button>
        </div>

        <h3 style="text-align: left; margin-top: 30px;">Respostas da turma (ao vivo)</h3>
        <table class="tabela-respostas">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Acertos</th>
                    <th>Última resposta</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpoRespostas">
                </tbody>
        </table>

        <button class="btn-voltar" onclick="window.location.href='index.html'">← Voltar para a tela inicial</button>
    </div>

</body>
